<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chimbera — Precios</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.18);
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --text-faint: #9a9a9a;
    --accent: #1a1a1a;
    --accent-fg: #ffffff;
    --success-bg: #eaf3de;
    --success-text: #3b6d11;
    --info-bg: #e6f1fb;
    --info-text: #185fa5;
    --danger-bg: #fcebeb;
    --danger-text: #a32d2d;
    --radius: 12px;
    --radius-sm: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --surface: #242424;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.18);
      --text: #f0ede8;
      --text-muted: #a0a0a0;
      --text-faint: #666;
      --accent: #f0ede8;
      --accent-fg: #1a1a1a;
      --success-bg: #173404;
      --success-text: #c0dd97;
      --info-bg: #042c53;
      --info-text: #b5d4f4;
      --danger-bg: #501313;
      --danger-text: #f7c1c1;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  #setup {
    max-width: 480px;
    margin: 0 auto;
    padding: 2rem 1rem 4rem;
  }

  .logo { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 0.25rem; }
  .logo span { color: var(--text-muted); font-weight: 400; }
  .subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 2rem; }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1rem;
  }

  .card-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 0.75rem;
  }

  label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 4px; }

  input[type="text"], input[type="search"] {
    width: 100%;
    padding: 10px 12px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--text); }
  input::placeholder { color: var(--text-faint); }

  .field { margin-bottom: 0.75rem; }
  .field:last-child { margin-bottom: 0; }

  .help { font-size: 12px; color: var(--text-faint); margin-top: 4px; line-height: 1.5; }
  .help code {
    background: var(--bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .mode-btn {
    padding: 1rem 0.75rem;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text-muted);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    font-size: 13px;
    line-height: 1.4;
  }
  .mode-btn i { display: block; font-size: 24px; margin-bottom: 6px; color: var(--text-faint); }
  .mode-btn .mode-name { font-weight: 500; color: var(--text); font-size: 14px; }
  .mode-btn .mode-desc { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .mode-btn:hover { border-color: var(--text); }
  .mode-btn.active { border: 2px solid var(--info-text); background: var(--info-bg); }
  .mode-btn.active i, .mode-btn.active .mode-name, .mode-btn.active .mode-desc { color: var(--info-text); }

  .btn-primary {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.15s;
    margin-top: 0.5rem;
  }
  .btn-primary:hover { opacity: 0.82; }

  #app { display: none; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 0.5px solid var(--border);
    padding: 0.75rem 1rem;
  }

  .topbar-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .app-title { font-size: 17px; font-weight: 600; }
  .app-meta { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .topbar-actions { display: flex; gap: 6px; }

  .icon-btn {
    width: 34px; height: 34px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: background 0.12s;
  }
  .icon-btn:hover { background: var(--border); }

  .search-wrap { position: relative; }
  .search-wrap i {
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--text-faint);
    pointer-events: none;
  }
  #search { padding-left: 34px; background: var(--surface); }

  .tabs {
    display: flex;
    gap: 6px;
    padding: 0.75rem 1rem 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    border: 0.5px solid var(--border-strong);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.12s;
    flex-shrink: 0;
  }
  .tab:hover { border-color: var(--text); color: var(--text); }
  .tab.active { background: var(--accent); color: var(--accent-fg); border-color: transparent; }

  .products {
    padding: 0.75rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 800px;
    margin: 0 auto;
  }

  .product-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
  }

  .pc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .pc-code { font-size: 11px; color: var(--text-faint); font-family: monospace; margin-bottom: 3px; }
  .pc-name { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .pc-prices { text-align: right; flex-shrink: 0; }
  .pc-venta { font-size: 22px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; }
  .pc-costo { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .pc-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 0.5px solid var(--border);
  }

  .pc-left { display: flex; align-items: center; gap: 6px; }

  .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
  .badge-sheet { background: var(--bg); color: var(--text-muted); border: 0.5px solid var(--border); }
  .badge-gain { background: var(--success-bg); color: var(--success-text); }

  .pc-date { font-size: 11px; color: var(--text-faint); display: flex; align-items: center; gap: 3px; }

  .status {
    margin: 1rem;
    padding: 0.9rem 1rem;
    border-radius: var(--radius-sm);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    line-height: 1.5;
  }
  .status.loading { background: var(--info-bg); color: var(--info-text); }
  .status.error { background: var(--danger-bg); color: var(--danger-text); }
  .status.hidden { display: none; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
    opacity: 0.6;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; padding: 4rem 1rem; color: var(--text-faint); }
  .empty i { font-size: 36px; display: block; margin-bottom: 0.5rem; }
  .empty p { font-size: 14px; }

  body.kiosco .pc-name { font-size: 18px; }
  body.kiosco .pc-venta { font-size: 28px; }
  body.kiosco .product-card { padding: 1.25rem 1.5rem; }

  @media (min-width: 600px) {
    .products { padding: 1rem 1.5rem; }
    .topbar { padding: 0.75rem 1.5rem; }
    .tabs { padding: 0.75rem 1.5rem 0; }
  }
  .btn-editar {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--info-text);
    color: var(--info-text);
    background: var(--info-bg);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .btn-editar:hover { opacity: 0.8; }
  .btn-editar i { font-size: 13px; }

  .btn-camara {
    width: 34px; height: 34px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .btn-camara:hover { background: var(--border); }

  .scanner-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .scanner-overlay.visible { display: flex; }

  .scanner-box {
    width: 100%;
    max-width: 360px;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
  }

  #scanner-region { width: 100%; }

  .scanner-title {
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 1rem;
    text-align: center;
  }
  .scanner-hint {
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    margin-top: 0.75rem;
    text-align: center;
  }
  .btn-cerrar-scanner {
    margin-top: 1.25rem;
    padding: 10px 28px;
    border-radius: var(--radius-sm);
    border: 0.5px solid rgba(255,255,255,0.3);
    background: transparent;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-cerrar-scanner:hover { background: rgba(255,255,255,0.1); }


  .ticket-fab {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    z-index: 50;
  }
  .ticket-fab.visible { display: flex; }
  .ticket-badge {
    position: absolute;
    top: -4px; right: -4px;
    background: #e24b4a;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .ticket-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 90;
    align-items: flex-end;
  }
  .ticket-overlay.visible { display: flex; }
  .ticket-panel {
    background: var(--surface);
    width: 100%;
    max-height: 90vh;
    border-radius: var(--radius) var(--radius) 0 0;
    overflow-y: auto;
    padding: 1.25rem 1rem 2rem;
  }
  .ticket-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .ticket-title { font-size: 17px; font-weight: 600; }
  .ticket-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .ticket-item-info { flex: 1; min-width: 0; }
  .ticket-item-name { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ticket-item-price { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .qty-control { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .qty-btn {
    width: 28px; height: 28px;
    border: 0.5px solid var(--border-strong);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-btn:hover { background: var(--border); }
  .qty-num { font-size: 15px; font-weight: 500; min-width: 20px; text-align: center; }
  .ticket-item-total { font-size: 15px; font-weight: 600; min-width: 70px; text-align: right; flex-shrink: 0; }
  .btn-del-item {
    width: 28px; height: 28px;
    border: none;
    background: transparent;
    color: var(--danger-text);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ticket-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 0 0.5rem;
    font-size: 18px;
    font-weight: 600;
  }
  .ticket-footer { display: flex; flex-direction: column; gap: 8px; margin-top: 0.75rem; }
  .btn-imprimir {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-imprimir:hover { opacity: 0.82; }
  .btn-limpiar {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: var(--text-muted);
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 14px;
    cursor: pointer;
  }
  .btn-limpiar:hover { background: var(--bg); }
  .ticket-empty { text-align: center; padding: 2rem; color: var(--text-faint); font-size: 14px; }
  .btn-agregar-ticket {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--success-text);
    color: var(--success-text);
    background: var(--success-bg);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    margin-left: 6px;
  }
  .btn-agregar-ticket:hover { opacity: 0.8; }
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: fixed; inset: 0; padding: 1rem; }
  }
</style>
</head>
<body>

<div id="setup">
  <div class="logo">Chimbera <span>precios</span></div>
  <p class="subtitle">Tu planilla ya está cargada — solo elegí el modo y tocá "Cargar precios"</p>

  <div class="card">
    <div class="card-label">Google Sheet</div>
    <div class="field">
      <label>ID de la planilla</label>
      <input type="text" id="inp-id" value="1tT-KogRhz08EG8N52QGs63aQ4orP4Hc8yC5q7wKu-v8" />
      <p class="help">Ya tiene el ID de tu planilla <code>mercaderiaChimbera</code></p>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Vista</div>
    <div class="mode-grid">
      <button class="mode-btn active" id="btn-kiosco" onclick="setMode('kiosco')">
        <i class="ti ti-device-desktop"></i>
        <div class="mode-name">Kiosco</div>
        <div class="mode-desc">Precio de venta</div>
      </button>
      <button class="mode-btn" id="btn-compras" onclick="setMode('compras')">
        <i class="ti ti-device-mobile"></i>
        <div class="mode-name">Compras</div>
        <div class="mode-desc">Costo + ganancia</div>
      </button>
    </div>
  </div>

  <button class="btn-primary" onclick="loadData()">
    <i class="ti ti-refresh"></i> Cargar precios
  </button>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-row1">
      <div>
        <div class="app-title" id="app-title">Precios de venta</div>
        <div class="app-meta" id="app-meta"></div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="recargar()" title="Actualizar"><i class="ti ti-refresh"></i></button>
        <button class="icon-btn" onclick="volverSetup()" title="Configuracion"><i class="ti ti-settings"></i></button>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;">
      <div class="search-wrap" style="flex:1;">
        <i class="ti ti-search"></i>
        <input type="search" id="search" placeholder="Buscar por nombre, codigo o barra..." oninput="renderizar()" onkeydown="if(event.key==='Enter'){event.preventDefault();}" autocomplete="off" />
      </div>
      <button class="btn-camara" onclick="abrirScanner()" title="Escanear codigo de barras">
        <i class="ti ti-scan"></i>
      </button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="status hidden" id="status"></div>
  <div class="products" id="products"></div>
</div>


<button class="ticket-fab" id="ticket-fab" onclick="abrirTicket()">
  <i class="ti ti-receipt"></i>
  <span class="ticket-badge" id="ticket-badge">0</span>
</button>

<div class="ticket-overlay" id="ticket-overlay" onclick="cerrarTicketSiAfuera(event)">
  <div class="ticket-panel" id="ticket-panel">
    <div class="ticket-header">
      <div class="ticket-title"><i class="ti ti-receipt"></i> Ticket</div>
      <button class="icon-btn" onclick="cerrarTicket()"><i class="ti ti-x"></i></button>
    </div>
    <div id="ticket-items"></div>
    <div id="ticket-area-total"></div>
    <div class="ticket-footer" id="ticket-footer" style="display:none;">
      <button class="btn-imprimir" onclick="imprimirTicket()"><i class="ti ti-printer"></i> Imprimir ticket</button>
      <button class="btn-limpiar" onclick="limpiarTicket()"><i class="ti ti-trash"></i> Limpiar y nuevo ticket</button>
    </div>
  </div>
</div>

<div id="print-area" style="display:none;"></div>

<!-- Scanner overlay -->
<div class="scanner-overlay" id="scanner-overlay">
  <div class="scanner-title">Apuntá la cámara al código de barras</div>
  <div class="scanner-box">
    <div id="scanner-region"></div>
  </div>
  <div class="scanner-hint">El resultado se carga automáticamente</div>
  <button class="btn-cerrar-scanner" onclick="cerrarScanner()">Cancelar</button>
</div>

<script>

var ticket = [];

function agregarAlTicket(p) {
  var idx = ticket.findIndex(function(t){ return t.codigo === p.codigo && t.desc === p.desc; });
  if (idx >= 0) {
    ticket[idx].qty++;
  } else {
    ticket.push(Object.assign({}, p, {qty: 1}));
  }
  actualizarFAB();
}

function actualizarFAB() {
  var fab = document.getElementById('ticket-fab');
  var badge = document.getElementById('ticket-badge');
  var total = ticket.reduce(function(s,t){ return s + t.qty; }, 0);
  badge.textContent = total;
  fab.classList.toggle('visible', total > 0);
}

function abrirTicket() {
  renderTicket();
  document.getElementById('ticket-overlay').classList.add('visible');
}

function cerrarTicket() {
  document.getElementById('ticket-overlay').classList.remove('visible');
}

function cerrarTicketSiAfuera(e) {
  if (e.target === document.getElementById('ticket-overlay')) cerrarTicket();
}

function cambiarQty(idx, delta) {
  ticket[idx].qty += delta;
  if (ticket[idx].qty <= 0) ticket.splice(idx, 1);
  actualizarFAB();
  renderTicket();
}

function eliminarItem(idx) {
  ticket.splice(idx, 1);
  actualizarFAB();
  renderTicket();
}

function limpiarTicket() {
  ticket = [];
  actualizarFAB();
  renderTicket();
  cerrarTicket();
}

function renderTicket() {
  var container = document.getElementById('ticket-items');
  var totalArea = document.getElementById('ticket-area-total');
  var footer = document.getElementById('ticket-footer');

  if (!ticket.length) {
    container.innerHTML = '<div class="ticket-empty">No hay productos en el ticket</div>';
    totalArea.innerHTML = '';
    footer.style.display = 'none';
    return;
  }

  container.innerHTML = ticket.map(function(t, i) {
    var subtotal = (t.venta * t.qty).toLocaleString('es-AR', {minimumFractionDigits:0, maximumFractionDigits:2});
    var unitario = t.venta.toLocaleString('es-AR', {minimumFractionDigits:0, maximumFractionDigits:2});
    return '<div class="ticket-item">' +
      '<div class="ticket-item-info">' +
        '<div class="ticket-item-name">' + t.desc + '</div>' +
        '<div class="ticket-item-price">$' + unitario + ' c/u</div>' +
      '</div>' +
      '<div class="qty-control">' +
        '<button class="qty-btn" onclick="cambiarQty(' + i + ',-1)">&#8722;</button>' +
        '<span class="qty-num">' + t.qty + '</span>' +
        '<button class="qty-btn" onclick="cambiarQty(' + i + ',1)">+</button>' +
      '</div>' +
      '<div class="ticket-item-total">$' + subtotal + '</div>' +
      '<button class="btn-del-item" onclick="eliminarItem(' + i + ')"><i class="ti ti-x"></i></button>' +
    '</div>';
  }).join('');

  var total = ticket.reduce(function(s,t){ return s + t.venta * t.qty; }, 0);
  totalArea.innerHTML = '<div class="ticket-total-row"><span>Total</span><span>$' +
    total.toLocaleString('es-AR', {minimumFractionDigits:0, maximumFractionDigits:2}) + '</span></div>';
  footer.style.display = 'flex';
}

function imprimirTicket() {
  var fecha = new Date().toLocaleString('es-AR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  var total = ticket.reduce(function(s,t){ return s + t.venta * t.qty; }, 0);
  var linea = '--------------------------------';
  var items = ticket.map(function(t) {
    var sub = (t.venta * t.qty).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
    var uni = t.venta.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
    var nombre = t.desc.length > 24 ? t.desc.substring(0,24) + '...' : t.desc;
    return '<div>' + nombre + '</div><div style="display:flex;justify-content:space-between;color:#555;font-size:12px;"><span>' + t.qty + ' x $' + uni + '</span><span>$' + sub + '</span></div>';
  }).join('<br>');

  var html = '<div style="font-family:monospace;font-size:13px;max-width:300px;margin:0 auto;color:#000;">' +
    '<div style="text-align:center;font-size:16px;font-weight:bold;margin-bottom:4px;">Almac&eacute;n La Chimbera</div>' +
    '<div style="text-align:center;font-size:12px;color:#555;margin-bottom:8px;">' + fecha + '</div>' +
    '<div>' + linea + '</div><br>' + items + '<br>' +
    '<div>' + linea + '</div>' +
    '<div style="display:flex;justify-content:space-between;font-size:15px;font-weight:bold;margin-top:6px;">' +
      '<span>TOTAL</span><span>$' + total.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '</span>' +
    '</div>' +
    '<div style="text-align:center;margin-top:12px;font-size:11px;color:#888;">&iexcl;Gracias por su compra!</div>' +
  '</div>';

  var pa = document.getElementById('print-area');
  pa.innerHTML = html;
  pa.style.display = 'block';
  window.print();
  pa.style.display = 'none';
}

// ── Hojas de la planilla ── agregá o quitá nombres acá
const HOJAS = ['almacen', 'alfer'];

let modo = 'kiosco';
let productos = [];
let hojas = [];
let hojaActiva = 'Todos';

function setMode(m) {
  modo = m;
  document.getElementById('btn-kiosco').classList.toggle('active', m === 'kiosco');
  document.getElementById('btn-compras').classList.toggle('active', m === 'compras');
}

function volverSetup() {
  document.getElementById('setup').style.display = 'block';
  document.getElementById('app').style.display = 'none';
  document.body.className = '';
}

async function cargarHoja(sheetId, sheetName) {
  const base = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&headers=1`;
  const url = sheetName ? base + `&sheet=${encodeURIComponent(sheetName)}` : base;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Error de red');
  const text = await res.text();
  const json = JSON.parse(text.substring(47, text.length - 2));
  if (!json.table || !json.table.rows) return [];
  const label = sheetName || 'Hoja 1';
  return json.table.rows
    .filter(row => row.c && row.c[1] && row.c[1].v)
    .map(row => {
      const c = row.c;
      const desc = String(c[1].v).trim();
      if (desc.toLowerCase() === 'descripcion') return null;
      return {
        codigo: c[0]?.v ?? '',
        desc,
        costo: parseFloat(c[2]?.v) || 0,
        ganancia: parseFloat(c[3]?.v) || 0,
        venta: parseFloat(c[4]?.v) || 0,
        fecha: c[5]?.f || c[5]?.v || '',
        hoja: label
      };
    })
    .filter(Boolean);
}

async function loadData() {
  const sheetId = document.getElementById('inp-id').value.trim();
  if (!sheetId) { alert('Ingresa el ID de la planilla'); return; }

  document.getElementById('setup').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.body.className = modo === 'kiosco' ? 'kiosco' : '';
  document.getElementById('app-title').textContent = modo === 'kiosco' ? 'Precios de venta' : 'Precios de costo';

  setStatus('Cargando precios...', 'loading');
  productos = []; hojas = []; hojaActiva = 'Todos';

  try {
    const resultados = await Promise.all(HOJAS.map(h => cargarHoja(sheetId, h)));
    productos = resultados.flat();
    hojas = [...new Set(productos.map(p => p.hoja))];
    if (productos.length === 0) {
      setStatus('La planilla esta vacia. Agrega productos en Google Sheets y vuelve a cargar.', 'error');
    } else {
      clearStatus();
    }
    buildTabs();
    renderizar();
    const now = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('app-meta').textContent = `${productos.length} productos · actualizado ${now}`;
  } catch(e) {
    setStatus('No se pudo acceder. Verifica que la planilla sea publica: Compartir → Cualquier persona con el enlace → Lector.', 'error');
  }
}

async function recargar() {
  const sheetId = document.getElementById('inp-id').value.trim();
  setStatus('Actualizando...', 'loading');
  try {
    const resultados = await Promise.all(HOJAS.map(h => cargarHoja(sheetId, h)));
    productos = resultados.flat();
    hojas = [...new Set(productos.map(p => p.hoja))];
    clearStatus();
    buildTabs();
    renderizar();
    const now = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('app-meta').textContent = `${productos.length} productos · actualizado ${now}`;
  } catch(e) {
    setStatus('Error al actualizar. Revisa tu conexion.', 'error');
  }
}

function buildTabs() {
  const c = document.getElementById('tabs');
  const all = ['Todos', ...hojas];
  c.innerHTML = all.map(h =>
    `<button class="tab ${h===hojaActiva?'active':''}" onclick="filtrarHoja('${h}')">${h}</button>`
  ).join('');
}

function filtrarHoja(h) {
  hojaActiva = h;
  buildTabs();
  renderizar();
}

function renderizar() {
  const q = (document.getElementById('search')?.value || '').toLowerCase();
  const c = document.getElementById('products');
  const palabras = q.split(/\s+/).filter(Boolean);
  const lista = productos.filter(p => {
    if (hojaActiva !== 'Todos' && p.hoja !== hojaActiva) return false;
    if (!palabras.length) return true;
    const texto = (String(p.codigo) + ' ' + p.desc).toLowerCase();
    return palabras.every(pal => texto.includes(pal));
  });

  if (!lista.length) {
    c.innerHTML = `<div class="empty"><i class="ti ti-search"></i><p>Sin resultados</p></div>`;
    return;
  }

  const sheetId = document.getElementById('inp-id').value.trim();
  c.innerHTML = lista.map(p => {
    const venta = p.venta.toLocaleString('es-AR', {minimumFractionDigits:0, maximumFractionDigits:2});
    const costo = p.costo.toLocaleString('es-AR', {minimumFractionDigits:0, maximumFractionDigits:2});
    const urlEditar = `https://docs.google.com/spreadsheets/d/${sheetId}/edit`;
    return `
      <div class="product-card">
        <div class="pc-top">
          <div>
            ${p.codigo ? `<div class="pc-code">${p.codigo}</div>` : ''}
            <div class="pc-name">${p.desc}</div>
          </div>
          <div class="pc-prices">
            <div class="pc-venta">$${venta}</div>
            ${modo==='compras' ? `<div class="pc-costo">Costo: $${costo}</div>` : ''}
          </div>
        </div>
        <div class="pc-bottom">
          <div class="pc-left">
            <span class="badge badge-sheet">${p.hoja}</span>
            ${modo==='compras' ? `<span class="badge badge-gain">+${p.ganancia}%</span>` : ''}
            <button class="btn-agregar-ticket" onclick='agregarAlTicket(${JSON.stringify({codigo:p.codigo,desc:p.desc,venta:p.venta,hoja:p.hoja})})'>
              <i class="ti ti-plus"></i> Ticket
            </button>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            ${p.fecha ? `<div class="pc-date"><i class="ti ti-clock"></i>${p.fecha}</div>` : ''}
            ${modo==='compras' ? `<a href="${urlEditar}" target="_blank" class="btn-editar" onclick="copiarAlPortapapeles('${p.desc.replace(/'/g, "\'")}')"><i class="ti ti-edit"></i> Editar</a>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}


function copiarAlPortapapeles(texto) {
  navigator.clipboard.writeText(texto).catch(() => {});
}
let html5QrCode = null;

function abrirScanner() {
  document.getElementById('scanner-overlay').classList.add('visible');
  html5QrCode = new Html5Qrcode('scanner-region');
  html5QrCode.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 280, height: 120 } },
    (decodedText) => {
      cerrarScanner();
      const input = document.getElementById('search');
      input.value = decodedText;
      renderizar();
    },
    () => {}
  ).catch(() => {
    cerrarScanner();
    alert('No se pudo acceder a la camara. Verifica los permisos del navegador.');
  });
}

function cerrarScanner() {
  document.getElementById('scanner-overlay').classList.remove('visible');
  if (html5QrCode) {
    html5QrCode.stop().catch(() => {});
    html5QrCode = null;
  }
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.className = `status ${type}`;
  el.innerHTML = type === 'loading'
    ? `<div class="spinner"></div><span>${msg}</span>`
    : `<i class="ti ti-alert-circle"></i><span>${msg}</span>`;
}
function clearStatus() { document.getElementById('status').className = 'status hidden'; }
</script>
